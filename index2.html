<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNSEEN বাঁশখালী</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f0f7f2;
      color: #173b2b;
      text-align: center;
    }
    header {
      background: #176b45;
      color: white;
      padding: 28px 12px;
    }
    section {
      background: white;
      margin: 16px;
      padding: 20px;
      border-radius: 12px;
    }
    a {
      display: inline-block;
      background: #176b45;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>UNSEEN বাঁশখালী</h1>
    <p>আমার বাঁশখালী, আমার গর্ব</p>
  </header>

  <section>
    <h2>বাঁশখালীর ইউনিয়ন ম্যাপ</h2>
    <p>যাচাইকৃত প্রশাসনিক ম্যাপ শীঘ্রই যুক্ত হবে।</p>
  </section>

  <section>
    <h2>ভ্রমণের অগ্রগতি</h2>
    <p>বাঁশখালীর দর্শনীয় স্থান ঘুরুন, অগ্রগতি সংরক্ষণ করুন।</p>
  </section>

  <section>
    <h2>ডাউনলোডযোগ্য পোস্টার</h2>
    <p>বাঁশখালীর জন্য পোস্টার এখানে যুক্ত হবে।</p>
  </section>
</body>
</html>
